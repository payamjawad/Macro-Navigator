<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macro Navigator</title>
<meta name="theme-color" content="#0B1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Navigator">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1424;--card:#121D33;--line:#23324F;--line2:#2C3D5E;--ink:#E7EEF8;--ink2:#C9D5E6;--mute:#8798B3;--blue:#2563EB;--blue2:#3B82F6;
--good:#34D399;--warn:#FBBF24;--bad:#F87171;--panel:#16294D;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
main{max-width:860px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
a{color:#93C5FD}
h2{margin:6px 0 0;font-size:16px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.dim{color:var(--mute);font-size:12px}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:focus-visible,.tab:focus-visible,input:focus-visible{outline:2px solid #93C5FD;outline-offset:2px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media(min-width:720px){.strip{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cell{background:var(--card);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell .v{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;height:44px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;font-size:15px;font-family:inherit;color:var(--ink);background:var(--card)}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tab{min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--ink2);font-size:13px;font-weight:600;text-decoration:none}
.tab[aria-current=page]{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.stance{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.p{margin:0;font-size:14px;line-height:1.5;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(min-width:720px){.wide2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}}
.mini{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:13px;align-items:baseline}
.row span:first-child{color:var(--mute)}
.pill{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;align-self:flex-start;white-space:nowrap}
.meter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.meter div{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mute)}
.meter i{height:6px;border-radius:3px;display:block}
.bar{height:8px;border-radius:4px;background:#1E2B45}.bar i{display:block;height:8px;border-radius:4px;background:var(--blue2)}
.layerbar{display:flex;gap:4px}.layerbar i{flex:1;height:6px;border-radius:3px}
.reading{background:var(--panel);border:1px solid #2C4A80;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.reading p{margin:0;font-size:15px;line-height:1.5}
.note{background:var(--panel);border:1px solid #2C4A80;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;color:#BFDBFE}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line2);background:var(--card);color:var(--ink2);font-size:13px;font-family:inherit;cursor:pointer}
.msgs{display:flex;flex-direction:column;gap:12px}
.me{align-self:flex-end;max-width:85%;background:var(--blue);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.ai{align-self:flex-start;max-width:94%;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ai p{margin:0;font-size:14px;line-height:1.55;color:var(--ink2)}
.looked{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.compose{display:flex;gap:8px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:8px}
.compose input{flex:1;min-width:0;height:48px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;font-size:15px;font-family:inherit;color:var(--ink);background:var(--card)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#1E2B45;border:1px solid var(--line2);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:13px;max-width:92vw;z-index:10}
@media(max-width:430px){.lbl{display:none}#refresh{width:44px;justify-content:center;padding:0}}
#asof{white-space:nowrap}
.foot{font-size:11px;line-height:1.45;color:var(--mute);margin:0}
@media (prefers-reduced-motion:no-preference){.ai.wait p{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}}
/* reading band */
.hero{display:flex;flex-direction:column;gap:6px;padding:18px 2px 6px}
.hero-k{font-size:13px;color:var(--mute)}
.hero-w{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;font-weight:700;font-size:clamp(40px,11vw,60px);line-height:1;letter-spacing:-.01em}
.hero-p{margin:2px 0 0;font-size:15px;line-height:1.5;color:var(--ink2);max-width:62ch}
.readings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
@media(max-width:420px){.readings{grid-template-columns:1fr}}
.rd{display:flex;flex-direction:column;gap:2px;padding:4px 0 4px 12px;border-left:3px solid var(--edge);min-width:0}
.rd-l{font-size:12px;color:var(--mute)}
.rd-v{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;font-size:19px;font-weight:600;color:var(--ink);line-height:1.2}
.rd-s{font-size:12px;color:var(--mute)}
/* quick guide */
.guide{display:flex;flex-direction:column;gap:12px;background:var(--card);border-radius:16px;padding:16px}
.gs{display:flex;flex-direction:column;gap:3px;padding-left:12px;border-left:3px solid var(--edge)}
.gs-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gs-h b{font-size:14px;color:var(--ink);font-weight:600}
.gs > span{font-size:13.5px;line-height:1.5;color:var(--ink2);max-width:70ch}
.decide{background:var(--panel);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.decide b{font-size:13px;color:#93C5FD;font-weight:600}
.decide p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink)}
.kd{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.kdi{flex:none;min-width:124px;display:flex;flex-direction:column;gap:1px;font-size:12px;padding:6px 10px;border-radius:10px;background:var(--bg)}
.kdi b{color:var(--ink);font-weight:600}.kdi span{color:var(--ink2)}
/* sections */
.secs{display:flex;flex-direction:column;background:var(--card);border-radius:16px;overflow:hidden}
.sec{border-top:1px solid var(--line)}.sec:first-child{border-top:0}
.sec summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto 16px;gap:10px;align-items:center;padding:14px 16px;min-height:52px}
.sec summary::-webkit-details-marker{display:none}
.sec summary:focus-visible{outline:2px solid #93C5FD;outline-offset:-2px}
.sec-t{font-size:15px;font-weight:600;color:var(--ink)}
.sec-a{font-size:13px;text-align:right;max-width:48vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.chev{transition:transform .18s ease}}
.sec[open] .chev{transform:rotate(180deg)}
.sec-b{padding:0 16px 18px;display:flex;flex-direction:column;gap:10px}
.sec-b > .card,.sec-b > section{background:none;border:0;padding:0;border-radius:0}
.sec-b > .card > b:first-child,.sec-b > .card > span.dim:first-child,.sec-b h2{display:none}
.sec-b .mini{background:var(--bg);border:0}
.sub{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--mute)}
.more summary{cursor:pointer;font-size:13px;color:#93C5FD;padding:4px 0}
/* odds bars */
.odds{display:grid;grid-template-columns:72px 1fr auto;gap:4px 10px;align-items:center}
.odds-h{font-size:13px;color:var(--mute)}
.odds-bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}.odds-bar i{display:block;height:100%;background:var(--good)}
.odds-v{font-size:14px;color:var(--ink);font-weight:600;white-space:nowrap}
.odds-r{grid-column:2 / 4;font-size:12px;color:var(--mute)}
.pillars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pl{display:flex;flex-direction:column;gap:3px;padding-left:10px;border-left:3px solid var(--edge)}
.pl b{font-size:15px}.pl span:last-child{font-size:13px;line-height:1.45;color:var(--ink2)}
.stance{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif}
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7 15l3-3 3 2 4-5"/></svg>Macro Navigator</span>
    <span style="display:flex;align-items:center;gap:10px"><span class="dim" id="asof">Loading…</span>
      <button class="btn" id="refresh" type="button" aria-label="Refresh data"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span class="lbl">Refresh</span></button></span>
  </div>
  <div class="note" id="health" hidden style="background:#3A2F0F;border-color:#7A5C14;color:#FCD34D"></div>
  <section class="strip" id="strip" aria-label="Markets"></section>
  <form class="search" id="searchForm" role="search">
    <label for="q" style="position:absolute;left:-9999px">Search economy, index or ticker</label>
    <input id="q" list="symbols" placeholder="Ticker, index or economy" autocomplete="off" autocapitalize="characters" enterkeyhint="search">
    <datalist id="symbols"></datalist>
    <button class="btn primary" type="submit">Go</button>
  </form>
  <nav class="tabs" aria-label="Views">
    <a class="tab" href="#economy" data-tab="economy">Economy</a>
    <a class="tab" href="#sp500" data-tab="sp500">S&amp;P 500</a>
    <a class="tab" href="#nasdaq" data-tab="nasdaq">Nasdaq</a>
    <a class="tab" href="#stock" data-tab="stock">Stock</a>
    <a class="tab" href="#ask" data-tab="ask">Ask</a>
  </nav>
  <div id="view" aria-live="polite"></div>
  <p class="foot">Research framework, not investment advice. Data: FRED, Yahoo Finance, SEC filings, Shiller, Ken French, ICE BofA via FRED (private use).</p>
</main>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const minus = s => String(s).replace(/^-/, "−");
const pct = (x, d = 0, sign = true) => x == null || !isFinite(x) ? "n/a" : minus((sign && x > 0 ? "+" : "") + (x * 100).toFixed(d) + "%");
const TONE = {good: "#34D399", warn: "#FBBF24", bad: "#F87171", neutral: "#A3B3CA"};
const PILL = {good: ["#6EE7B7", "#0F3A2E"], warn: ["#FCD34D", "#3A2F0F"], bad: ["#FCA5A5", "#3F1C22"], neutral: ["#B6C3D6", "#1E2B45"], blue: ["#93C5FD", "#16294D"]};
const pill = (text, tone = "neutral") => `<span class="pill" style="color:${PILL[tone][0]};background:${PILL[tone][1]}">${esc(text)}</span>`;
const TAGTONE = {"Proven": "good", "Research-backed": "good", "Well documented": "blue", "No model edge": "neutral", "No proven edge": "neutral", "Not modelled yet": "warn", "Model": "blue", "No signal": "neutral"};
const S = {summary: null, universe: [], bySym: {}, chat: []};
try { S.chat = JSON.parse(localStorage.getItem("mn_chat") || "[]"); } catch (e) { S.chat = []; }

async function getJSON(path) {
  const r = await fetch(path + (path.includes("?") ? "&" : "?") + "v=" + Date.now().toString().slice(0, -5));
  if (!r.ok) throw new Error(path + " " + r.status);
  const text = await r.text();
  return JSON.parse(text.replace(/\bNaN\b|-?\bInfinity\b/g, "null"));
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}
function horizonCards(list) {
  return `<section class="grid3" aria-label="Direction by horizon">${list.map(h => `<div class="mini">
    <span class="dim" style="font-size:11px">${esc(h.h)}</span>
    <span style="font-size:14px;font-weight:600;line-height:1.25;color:${TONE[h.tone] || TONE.neutral}">${esc(h.text)}</span>
    ${pill(h.tag, TAGTONE[h.tag] || "neutral")}</div>`).join("")}</section>`;
}

// ------------------------------------------------------------------ header
function renderHeader() {
  const s = S.summary;
  $("#asof").textContent = "Prices to " + new Date((s.prices_to || s.data_to) + "T00:00:00").toLocaleDateString(undefined, {day: "numeric", month: "short"});
  const ref = new Date((s.prices_to || s.data_to) + "T00:00:00");
  const stale = c => c.date && (ref - new Date(c.date + "T00:00:00")) / 864e5 > 3;
  const short = d => new Date(d + "T00:00:00").toLocaleDateString(undefined, {day: "numeric", month: "short"});
  $("#strip").innerHTML = s.strip.map(c => `<div class="cell"><span class="dim" style="font-size:11px">${esc(c.label)}</span>
    <span class="v">${esc(c.value)}</span><span style="font-size:11px;color:${TONE[c.tone] || TONE.neutral}">${esc(stale(c) ? "as of " + short(c.date) : c.note)}</span></div>`).join("");
  const h = s.health || [];
  if (h.length) { const el = $("#health"); el.hidden = false;
    el.textContent = "The last run could not load: " + h.join("; ") + ". Readings that depend on them show n/a or may be out of date. Press Refresh to try again."; }
  $("#symbols").innerHTML = S.universe.map(u => `<option value="${esc(u.s)}">${esc(u.n || "")}</option>`).join("");
}

// ------------------------------------------------------------------ economy
function renderEconomy() {
  const e = S.summary.economy, w = S.summary.recession_watch, cv = (w || {}).curve;
  const pillars = `<div class="pillars">${e.pillars.map(p => `<div class="pl" style="--edge:${TONE[p.tone]}"><span class="dim">${esc(p.name)}</span>
      <b style="color:${TONE[p.tone]}">${esc(p.label)}</b><span>${esc(p.detail)}</span></div>`).join("")}</div>`;
  const why = (e.why || []).length ? `<b style="font-size:14px">${esc(e.rule || "")}</b>${e.why.map(x => `<p class="p">${esc(x)}</p>`).join("")}` : "";
  const hist = `${e.history.map(h => `<div class="row"><span>${esc(h.name)}</span><b style="color:${Math.abs(h.z || 0) >= 1.5 ? TONE.bad : "var(--ink)"}">${h.z == null ? "n/a" : minus((h.z > 0 ? "+" : "") + h.z.toFixed(1)) + " sd from normal"}</b></div>`).join("")}
    <div class="row"><span>Recession odds, NY Fed yield-curve model</span><b>${e.recession_prob == null ? "n/a" : "about " + Math.round(e.recession_prob * 100) + "%"}</b></div>`;
  const change = e.watch.map(x => `<div class="row"><span>${esc(x.name)}: ${esc(x.rule)}</span><b>Now ${esc(x.now)}</b></div>`).join("");
  const curveRd = cv ? {label: "Yield curve", value: cv.state.replace(" after an inversion", ""), tone: cv.state === "Inverted" ? "bad" : cv.state === "Normal" ? "good" : "warn",
                        sub: `10-year minus 3-month ${minus((cv.spread_10y_3m >= 0 ? "+" : "") + cv.spread_10y_3m.toFixed(2))} pts`} : null;
  const infl = e.pillars.find(p => /nflation/.test(p.name));
  return hero("Economy", e.regime, e.tone, firstSentence(e.text), [watchReading(w), curveRd, infl ? {label: "Inflation", value: infl.label, tone: infl.tone} : null])
    + `<div class="secs">`
    + sec("Recession watch", recessionAnswer(w), w ? LTONE[w.level] : "neutral", recessionCard(w), true)
    + sec("The four pillars", e.pillars.map(p => p.label).join(", "), e.tone, pillars, true)
    + sec("Why this regime", "", "neutral", why)
    + sec("Today versus history", "", "neutral", hist)
    + sec("What would change this read", "", "neutral", change)
    + sec("Explain with AI", "Plain English", "neutral", explainBox("economy", "Explain today's economic regime in plain English for a non-expert: what each pillar shows, why it gets this label, and what it means for stock markets.", ""))
    + `</div><a class="btn primary" href="#sp500" style="justify-content:center;text-decoration:none">What this means for the S&amp;P 500</a>`;
}

// ------------------------------------------------------------------ S&P 500
function renderMarket() {
  const m = S.summary.market, c = m.criteria || {}, call = m.call || {}, a = m.analog || {}, combo = m.combo;
  const levelTone = {"High risk": "bad", "Elevated risk": "warn", "Normal": "good", "Recovery window": "good"}[c.level] || "neutral";
  const idx = {"Normal": 0, "Elevated risk": 1, "High risk": 2}[c.level];
  const meterCol = ["#34D399", "#FBBF24", "#F87171"], meterOff = ["#1E3A33", "#3A3115", "#3F1C22"];
  const meter = `<div class="meter" aria-label="Risk meter">${["Normal", "Elevated", "High"].map((n, i) =>
    `<div><i style="background:${i === idx ? meterCol[i] : meterOff[i]}"></i><span style="${i === idx ? "color:" + meterCol[i] + ";font-weight:600" : ""}">${n}</span></div>`).join("")}</div>`;
  const defOn = (c.defensive || []).filter(d => d.now), recOn = (c.recovery || []).filter(d => d.now), shortOn = (c.short || []).filter(d => d.now);
  const capeProven = (c.defensive || []).some(d => /CAPE/.test(d.signal));
  const val = (m.drivers || []).find(d => d.name === "Valuation");
  const capeOn = val ? val.on : defOn.some(d => /CAPE/.test(d.signal));
  const baseRate = /base rate/.test(call.basis || "");
  const tnow = (m.trend_rule || {}).now, tlive = (m.trend_rule || {}).live;
  const horizons = [
    tnow ? (tnow.in_stocks ? {h: "1–3 months", text: "Supportive: trend intact" + (tlive && !tlive.in_stocks ? " (may switch at month-end)" : ""), tone: tlive && !tlive.in_stocks ? "warn" : "good", tag: "Proven"}
                           : {h: "1–3 months", text: "Defensive: trend broken" + (tlive && tlive.in_stocks ? " (may switch at month-end)" : ""), tone: tlive && tlive.in_stocks ? "warn" : "bad", tag: "Proven"})
      : (defOn.length || shortOn.length) ? {h: "1–3 months", text: "Bumpier than usual", tone: "bad", tag: "Proven"}
      : {h: "1–3 months", text: "Normal", tone: "neutral", tag: "No signal"},
    baseRate ? {h: "6–12 months", text: "Normal odds, " + Math.round((call.base_rate || 0) * 100) + "%", tone: "neutral", tag: "No proven edge"}
      : {h: "6–12 months", text: Math.round((call.prob_up_12m || 0) * 100) + "% chance higher", tone: "neutral", tag: "Model"},
    capeOn ? {h: "3–5 years", text: "Below-average returns", tone: "bad", tag: capeProven ? "Proven" : "Research-backed"}
      : {h: "3–5 years", text: "Valuation not stretched", tone: "good", tag: capeProven ? "Proven" : "Research-backed"},
  ];

    if (m.above_200d === false) parts.push(`Its own trend is negative (below its 200-day average${m.sma200 ? ", about " + m.sma200.toLocaleString() : ""}). In 2026 tests on S&P 500 stocks, a stock's own trend did not predict its next 1 to 3 months after costs.`);
    else if (m.above_200d) parts.push("Its own trend is positive (above its 200-day average). In 2026 tests on S&P 500 stocks, a stock's own trend did not predict its next 1 to 3 months after costs.");
  } else if (m.above_200d === false) parts.push(`Its own trend is negative (below its 200-day average${m.sma200 ? ", about " + m.sma200.toLocaleString() : ""}); trend research on indices and sectors finds that prices below their long-term trend have tended to lag in the short run.`);
  else if (m.above_200d) parts.push("Its own trend is positive (above its 200-day average), which trend research on indices and sectors counts in its favour short term.");
  if (m.beta != null && m.beta > 1.1) parts.push(`It moves about ${m.beta.toFixed(1)}× the market, so expect larger swings both ways.`);
  if ((c.level === "High risk" || c.level === "Elevated risk") && trig) parts.push(`Market moments that have marked better entry points: ${trig}.`);
  return `<section class="card"><span class="dim">Is now a good time to buy ${esc(t.symbol)}?</span><p class="p">${esc(parts.join(" "))}</p>
    <span class="dim" style="font-size:11px">What past data shows, not a recommendation.</span></section>`;
}
function explainBox(key, question, symbol) {
  return `<section class="card"><div class="row"><b style="font-size:14px;color:var(--ink)">Plain-English explanation</b>
    <button class="btn" type="button" id="explainBtn" data-q="${esc(question)}" data-s="${esc(symbol || "")}" data-k="${esc(key)}">Explain with AI</button></div>
    <div id="explainOut"></div></section>`;
}
function wireExplain() {
  const b = $("#explainBtn"); if (!b) return;
  const key = "mn_ex_" + b.dataset.k + "_" + (S.summary.prices_to || S.summary.data_to);
  const show = d => { $("#explainOut").innerHTML = bubble({role: "assistant", ...d}).replace('class="ai', 'style="max-width:100%" class="ai'); };
  try { const c = JSON.parse(localStorage.getItem(key) || "null"); if (c) { show(c); b.textContent = "Explained"; } } catch (e) {}
  b.onclick = async () => {
    b.disabled = true; show({text: "Writing an explanation from today's data…", wait: true});
    try {
      const r = await fetch("api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({messages: [{role: "user", text: b.dataset.q}], symbol: b.dataset.s || null, asset: S.liveAsset || null})});
      const d = await r.json();
      const out = {text: d.text || d.error || "No answer.", looked: d.looked, check: d.check, model: d.model};
      show(out); if (r.ok && !/Locked/.test(d.model || "")) localStorage.setItem(key, JSON.stringify(out));
    } catch (e) { show({text: "The explanation needs the Cloudflare deployment."}); }
    b.disabled = false;
  };
}

// ------------------------------------------------------------------ index / stock view
function renderAsset(t, opts = {}) {
  const m = t.metrics || {}, ev = t.risk_evidence, b = m.beta, isStock = t.kind === "stock", w = S.summary.recession_watch;
  const liveNote = t.live ? `<div class="note">Live price lookup: ${esc(t.symbol)} is not in the daily list, so earnings, company figures and the sector layer are missing. To include it every day, add it to config/watchlist.txt in your GitHub repository.</div>` : "";
  const price = m.price == null ? "n/a" : m.price.toLocaleString(undefined, {maximumFractionDigits: 2});
  const e = t.earnings, f = t.financials, ad = t.after_dips;
  const readings = isStock
    ? [{label: "Its swings", value: b == null ? "n/a" : `${b.toFixed(1)}× the market`, tone: b != null && b >= 1.3 ? "warn" : "neutral", sub: "if the S&P moves 10%"},
       e && e.next && e.next.date ? {label: "Next results", value: fdate(e.next.date), tone: e.next.days != null && e.next.days <= 14 ? "warn" : "neutral", sub: e.next.days != null ? `in ${e.next.days} days` : ""} : watchReading(w),
       ad && ad["6 months"] ? {label: "After market dips", value: `${Math.round(ad["6 months"].up * 100)}% higher`, tone: ad["6 months"].up >= 0.6 ? "good" : "warn", sub: "6 months later"} : trendReading()]
    : [trendReading(), watchReading(w), dipReading()];
  const layers = `${t.layers.map(l => `<div class="row"><span>${esc(l.name)}</span><b style="text-align:right">${esc(l.text)} ${pill({good: "Tailwind", bad: "Headwind", warn: "Mixed", neutral: "Neutral"}[l.tone], l.tone)}</b></div>`).join("")}
    ${horizonCards(t.horizons)}`;
  const risk = `<div class="row"><span>Sensitivity to the S&amp;P 500 (beta)</span><b>${b == null ? "n/a" : b.toFixed(2)}</b></div>
    <div class="row"><span>If the S&amp;P falls 10%, typical move</span><b style="color:${b != null && b < 0 ? TONE.good : TONE.bad}">${b == null ? "n/a" : pct(-0.1 * b, 0)}</b></div>
    <div class="row"><span>Moves explained by the market</span><b>${m.r2 == null ? "n/a" : Math.round(m.r2 * 100) + "%"}</b></div>
    <div class="row"><span>Return over 1, 3 and 12 months</span><b>${pct(m.ret_1m)}, ${pct(m.ret_3m)}, ${pct(m.ret_12m)}</b></div>
    ${ev ? `<div class="row"><span>Worst dip within 12 months, in ${ev.episodes} past months like now</span><b style="color:${TONE.bad}">${pct(ev.dip)} <span class="dim" style="font-weight:400">S&amp;P ${pct(ev.spx_dip)}</span></b></div>` : ""}
    ${linkCard(t)}`;
  const flips = t.flips.map(x => `<div class="row"><span>${esc(x.name)}</span><b style="font-weight:500;text-align:right">${esc(x.text)}</b></div>`).join("");
  const nq = t.symbol === "^NDX" ? sitItem("Nasdaq-100") : null;
  const guide = isStock && !t.live ? guidePanel(stockSteps(t), stockDecision(t), e && e.next && e.next.date ? [{date: e.next.date, name: `${t.symbol} results (estimated)`, days: e.next.days}] : [])
              : (t.symbol === "^NDX" ? guidePanel(marketSteps(), marketDecision()) : "");
  return liveNote
    + hero(`${t.name} (${t.symbol})${t.sector ? ", " + t.sector : ""}`, price, (m.chg_1d || 0) >= 0 ? "good" : "bad",
           `${pct(m.chg_1d, 1)} on the day, ${pct(m.from_high, 0)} from its 52-week high. ${t.headline}${isStock ? " (context, not a tested signal)" : ""}.`, readings)
    + guide
    + `<div class="secs">`
    + (isStock ? sec("After past market dips like today's", afterDipsAnswer(t), ad && ad["6 months"] && ad["6 months"].up >= 0.6 ? "good" : "neutral", afterDipsCard(t), true) : "")
    + (nq ? sec("Similar past situations", sitLine(nq), "neutral", situationCard(nq), true) : "")
    + sec("Layers and direction", t.headline, t.headline_tone, layers)
    + sec("Market risk", b == null ? "" : `${b.toFixed(1)}× the market`, b != null && b >= 1.3 ? "warn" : "neutral", risk)
    + (e ? sec("Earnings", e.next && e.next.date ? `Next about ${fdate(e.next.date)}` : "", e.next && e.next.days != null && e.next.days <= 14 ? "warn" : "neutral", earningsCard(t)) : "")
    + (f ? sec("Company financials", f.unavailable ? "Not available" : (f.revenue_growth != null ? `Revenue ${pct(f.revenue_growth, 0)} on a year ago` : ""), "neutral", financialsCard(t)) : "")
    + sec("Is now a good time to buy?", "What history shows", "neutral", assetBuyCard(t))
    + sec("What would change the view", "", "neutral", flips)
    + sec("Explain with AI", "Plain English", "neutral", explainBox("asset_" + t.symbol, t.symbol === "^NDX"
        ? "Explain the Nasdaq 100 view in plain English: how it differs from the S&P 500, what each layer and horizon means, and what history says about buying now."
        : `Explain the ${t.symbol} view in plain English: what each layer shows, what drives each horizon, and what history says about buying now.`, t.symbol))
    + `</div><p class="dim" style="margin:0;line-height:1.5">${esc(opts.reading || (isStock ? "For single stocks, the 2026 tests found no tested timing edge: the market's trend rule, the stock's risk and its earnings dates are what to act on." : "Only tags marked Proven or Research-backed rest on tested evidence."))}</p>`;
}
async function loadAsset(sym) {
  const u = S.bySym[sym.toUpperCase()];
  if (!u) return null;
  return getJSON("data/tickers/" + u.f + ".json");
}
async function renderNasdaq() {
  const t = await loadAsset("^NDX");
  if (!t) return `<div class="note">Nasdaq 100 data is not in this build yet.</div>`;
  return renderAsset(t, {reading: "The Nasdaq takes the market's stance, then scales it: tech usually swings harder than the S&P and reacts more to real interest rates."});
}
async function renderStock(sym) {
  const recent = JSON.parse(localStorage.getItem("mn_recent") || "[]");
  const quick = ["NVDA", "AAPL", "MSFT", "AMZN", "GOOGL", "META", "TSLA", "JPM"].filter(s => S.bySym[s]);
  const picker = `<section class="card"><span class="dim">Pick a stock, or type any ticker in the search box</span>
    <div class="chips">${[...new Set([...recent, ...quick])].slice(0, 10).map(s => `<a class="chip" href="#stock/${encodeURIComponent(s)}" style="display:inline-flex;align-items:center;text-decoration:none">${esc(s)}</a>`).join("")}</div></section>`;
  if (!sym) return picker;
  let t = await loadAsset(sym);
  S.liveAsset = null;
  if (!t) {
    try { const r = await fetch("api/quote?s=" + encodeURIComponent(sym)); if (r.ok) { t = await r.json(); S.liveAsset = t; } } catch (e) {}
    if (t) return renderAsset(t);
  }
  if (!t) return `<section class="card"><b style="font-size:16px">No prices found for ${esc(sym)}</b>
      <p class="p">${esc(sym)} is not in the daily list (S&amp;P 500, Nasdaq-100 and your watchlist), and neither Yahoo nor Stooq returned prices for it. Check the ticker: US listings use the plain symbol, for example SOFI or PLTR. To include a stock every day, add it to config/watchlist.txt in your GitHub repository.</p></section>` + picker;
  localStorage.setItem("mn_recent", JSON.stringify([sym, ...recent.filter(s => s !== sym)].slice(0, 8)));
  return renderAsset(t);
}

// ------------------------------------------------------------------ chat
const SUGGEST = ["What's the market stance?", "When is it safer to add risk?", "Nasdaq vs S&P risk", "How does NVDA look?"];
function bubble(m) {
  if (m.role === "user") return `<div class="me">${esc(m.text)}</div>`;
  const paras = String(m.text || "").split(/\n{2,}|\n(?=[-•])/).map(x => `<p>${esc(x.trim())}</p>`).join("");
  const check = m.check ? (m.check.total === 0 ? "" : m.check.unmatched.length === 0
      ? `<span class="looked" style="color:#6EE7B7">✓ All ${m.check.total} numbers matched your data</span>`
      : `<span class="looked" style="color:#FCD34D">${m.check.unmatched.length} of ${m.check.total} numbers not found in your data: ${esc(m.check.unmatched.join(", "))}</span>`) : "";
  return `${m.looked ? `<div class="looked">Looked up: ${esc(m.looked.join(", "))}</div>` : ""}
    <div class="ai${m.wait ? " wait" : ""}">${paras}
      ${m.sources && m.sources.length ? `<div class="chips">${m.sources.map(s => `<a class="pill" style="color:#93C5FD;background:#16294D;text-decoration:none;font-size:12px;padding:4px 8px" href="${esc(s.href)}">${esc(s.label)}</a>`).join("")}</div>` : ""}
      ${check}${m.model ? `<span class="dim" style="font-size:11px">${esc(m.model)}</span>` : ""}</div>`;
}
function renderChat() {
  return `<section class="card"><div class="row"><b style="font-size:22px;color:var(--ink)">Ask Navigator</b>${pill("Gemini", "blue")}</div>
      <p class="p" style="font-size:13px">Answers use your latest run. Gemini writes the words; every number comes from your data and is checked before it is shown.</p></section>
    <section class="chips" aria-label="Suggested questions">${SUGGEST.map(q => `<button class="chip" type="button" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</section>
    <section class="msgs" id="msgs" aria-label="Conversation">${S.chat.map(bubble).join("")}</section>
    <form class="compose" id="compose"><label for="cq" style="position:absolute;left:-9999px">Your question</label>
      <input id="cq" placeholder="Ask about the economy, an index or a stock" autocomplete="off" enterkeyhint="send">
      <button class="btn primary" type="submit" aria-label="Send" style="width:48px;height:48px;justify-content:center;padding:0">➜</button></form>
    <p class="foot">Google's free tier may use prompts to improve its products, so don't share private details. <a href="#" id="clearChat">Clear conversation</a></p>`;
}
async function ask(q) {
  q = q.trim(); if (!q) return;
  S.chat.push({role: "user", text: q});
  const wait = {role: "assistant", text: "Looking at your data…", wait: true};
  S.chat.push(wait); draw();
  try {
    const r = await fetch("api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({messages: S.chat.filter(m => !m.wait).slice(-10).map(m => ({role: m.role, text: m.text})), symbol: S.lastSymbol || null})});
    const d = await r.json();
    Object.assign(wait, {text: d.text || d.error || "No answer.", looked: d.looked, check: d.check, model: d.model, sources: d.sources, wait: false});
  } catch (e) {
    Object.assign(wait, {text: "Chat needs the Cloudflare deployment (it can't run from a file on your computer).", wait: false});
  }
  S.chat = S.chat.slice(-30);
  localStorage.setItem("mn_chat", JSON.stringify(S.chat.filter(m => !m.wait)));
  draw();
}

// ------------------------------------------------------------------ routing
let current = "";
async function draw() {
  const [tab, sym] = (location.hash.slice(1) || "sp500").split("/");
  document.querySelectorAll(".tab").forEach(a => a.setAttribute("aria-current", a.dataset.tab === tab ? "page" : "false"));
  const v = $("#view");
  try {
    if (tab === "economy") v.innerHTML = renderEconomy();
    else if (tab === "nasdaq") v.innerHTML = await renderNasdaq();
    else if (tab === "stock") { if (sym) S.lastSymbol = decodeURIComponent(sym).toUpperCase(); v.innerHTML = await renderStock(sym ? decodeURIComponent(sym).toUpperCase() : null); }
    else if (tab === "ask") {
      v.innerHTML = renderChat();
      v.querySelectorAll("[data-q]").forEach(b => b.onclick = () => ask(b.dataset.q));
      $("#compose").onsubmit = e => { e.preventDefault(); const i = $("#cq"); const q = i.value; i.value = ""; ask(q); };
      $("#clearChat").onclick = e => { e.preventDefault(); S.chat = []; localStorage.removeItem("mn_chat"); draw(); };
      const msgs = $("#msgs"); if (msgs.lastElementChild) msgs.lastElementChild.scrollIntoView({block: "end"});
    } else v.innerHTML = renderMarket();
    wireExplain();
    const add = $("#addWatch");
    if (add) add.onclick = async () => {
      add.disabled = true;
      try { const r = await fetch("api/watchlist", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({symbol: sym})}); const d = await r.json(); toast(d.message || "Done"); }
      catch (e) { toast("Adding to the watchlist needs the Cloudflare deployment."); }
    };
  } catch (e) {
    v.innerHTML = `<div class="note">Could not load this view: ${esc(e.message)}</div>`;
  }
  if (tab !== current) { window.scrollTo(0, 0); current = tab; }
}
const ALIAS = {TSMC: "TSM", TAIWAN: "TSM", GOOGLE: "GOOGL", ALPHABET: "GOOGL", FACEBOOK: "META", BERKSHIRE: "BRK-B", NOVO: "NVO"};
function resolve(q) {
  const up = q.toUpperCase().replace(/^\$/, "").trim().replace(/\./g, "-");
  if (S.bySym[up]) return up;                                            // exact ticker in the daily list
  if (ALIAS[up]) return ALIAS[up];                                       // known nickname (TSMC, GOOGLE ...)
  const l = q.toLowerCase().trim();
  const starts = S.universe.find(u => (u.n || "").toLowerCase().startsWith(l));
  if (starts && l.length >= 3) return starts.s;                          // company name ("apple", "nvidia")
  if (/^[A-Z][A-Z0-9-]{0,5}$/.test(up)) return up;                        // looks like a ticker: look it up live
  const has = l.length >= 4 ? S.universe.find(u => (u.n || "").toLowerCase().includes(l)) : null;
  return has ? has.s : up;
}
$("#searchForm").onsubmit = e => {
  e.preventDefault();
  const q = $("#q").value.trim(); if (!q) return;
  const l = q.toLowerCase();
  if (/^econ/.test(l)) location.hash = "economy";
  else if (/^(s&p|sp500|spx|s and p|\^gspc)/.test(l)) location.hash = "sp500";
  else if (/^(nasdaq|ndx|\^ndx)/.test(l)) location.hash = "nasdaq";
  else if (/^(ask|chat)/.test(l)) location.hash = "ask";
  else location.hash = "stock/" + encodeURIComponent(resolve(q));
  $("#q").value = ""; $("#q").blur();
};
$("#refresh").onclick = async () => {
  const b = $("#refresh"); b.disabled = true;
  try { const r = await fetch("api/refresh", {method: "POST"}); const d = await r.json(); toast(d.message || "Refresh requested"); }
  catch (e) { toast("Refresh needs the Cloudflare deployment."); }
  setTimeout(() => b.disabled = false, 10000);
};
window.addEventListener("hashchange", draw);
(async () => {
  try {
    [S.summary, S.universe] = await Promise.all([getJSON("data/summary.json"), getJSON("data/universe.json")]);
    S.universe.forEach(u => S.bySym[u.s.toUpperCase()] = u);
    renderHeader(); draw();
  } catch (e) {
    $("#view").innerHTML = `<div class="note">Could not load the data (${esc(e.message)}). If this is a new setup, run Actions → Publish → Run workflow; otherwise press Refresh.</div>`;
  }
})();
</script>
